<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="./css/main.css"/>
  </head>
  <body>
    <div class="menu-container">
      <h1 class="menu-title">SETTINGS</h1>

      <div class="slider-container">
        <div class="sliders">
          <p>Game Volume: <span id="gameVolume"></span></p>
          <input type="range" id="gameVolumeSlider" min="0" max="1" step="0.01" value="1" class="slider">
        </div>

        <div class="sliders">
          <p>SFX Volume: <span id="sfxVolume"></span></p>
          <input type="range" id="sfxVolumeSlider" min="0" max="100" value="50" class="slider">
        </div>
      </div>
      <div class="menu-buttons">
        <a href="../main.html" class="back-button">BACK</a>
      </div>
    </div>
    
    <script src="../audio/audio.js"></script>
    <script src="../audio/audio-settings.js"></script>
  </body>
</html>
