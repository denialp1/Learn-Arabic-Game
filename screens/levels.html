<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Select</title>
    <link rel="stylesheet", href="./css/main.css" />
  </head>
  <body>
    <div class="menu-container">
      <h1 class="menu-title">LEVEL SELECT</h1>
      
      <div class="menu-buttons">
        
        <div class="menu-item">
          <a href="customize.html" class="menu-button" onclick="setLevel(1)">Level 1</a>
          <div class="circular-progress" data-inner-circle-color="lightgrey" data-percentage="80" data-progress-color="crimson" data-bg-color="black">
            <div class="inner-circle"></div>
            <p class="percentage">100%</p>
          </div>          
        </div>

        <div class="menu-item">
          <a href="customize.html" class="menu-button" onclick="setLevel(2)">Level 2</a>
          <div class="circular-progress2" data-inner-circle-color="lightgrey" data-percentage="80" data-progress-color="crimson" data-bg-color="black">
            <div class="inner-circle2"></div>
            <p class="percentage">0%</p>
          </div>          
        </div>

        <div class="menu-item">
          <a href="customize.html" class="menu-button" onclick="setLevel(3)">Level 3</a>
          <div class="circular-progress2" data-inner-circle-color="lightgrey" data-percentage="80" data-progress-color="crimson" data-bg-color="black">
            <div class="inner-circle2"></div>
            <p class="percentage">0%</p>
          </div>          
        </div>

        <a href="../main.html" class="back-button">BACK</a>
      </div>
    </div>
    <script src="./levels.js"></script>
  </body>
</html>
