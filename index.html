<style>
    body, html {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: black;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .canvas-container {
        position: relative;
        width: 800px;
        height: 600px;
    }

    canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%; 
        height: 100%;
        z-index: 1;
    }

    .button-container {
        position: absolute;
        top: 75%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .custom {
        opacity: 0;
        color: black;
        padding: 20px 182px;
        margin-bottom: 16px;
        background-color: #D2B48C;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: medium;
        cursor: pointer;
        box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.6);
    }

    .custom:hover {
            background-color: #B09068;
        }
</style>
