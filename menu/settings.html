<!DOCTYPE html>
<html lang="en">
  <head>
    <title></title>
    <link rel="stylesheet" type="text/css" href="settings.css" />
  </head>
  <body>
    <div class="container">
      <div class="content">
        <h1>SETTINGS</h1>
        <button class="btn"><a href='index.html'>START</a></button>
        <button class="btn"><a href='levels.html'>LEVELS</a></button>
        <button class="btn">SETTINGS</button>

        <div class="slidecontainer">
          <!-- Game Volume Slider -->
          <p>Game Volume: <span id="gameVolume"></span></p>
          <input type="range" id="gameVolumeSlider" min="0" max="1" step="0.01" value="1">
        </div>

        <div class="slidecontainer">
        <!-- SFX Volume Slider -->
          <p>SFX Volume: <span id="sfxVolume"></span></p>
          <input type="range" min="0" max="100" value="50" class="slider" id="sfxVolumeSlider">
        </div>

      </div>
    </div>    
  <script src="../audio/audio.js"></script>
  <script src="../audio/audio-settings.js"></script>
  </body>
</html>
